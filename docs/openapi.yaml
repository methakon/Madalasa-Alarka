          "durable_stage": {
            "type": "string",
            "enum": [
              "INBOX_COMMITTED",
              "RAW_OBSERVATIONS_COMMITTED"
            ],
            "description": "Optional. Default GPS design uses INBOX_COMMITTED. If not present clients rely on durable HTTP 202 and queued state, never assume trips processed."
          },
          "received_at": {
            "type": "string",
            "format": "date-time",
            "description": "Optional authoritative server receive time for committed batch; not observed_at of a location fix"
          }
        },
        "description": "Durable server receipt, not device capture confirmation and not evidence of route reconstruction. For GPS default, processing=QUEUED means PostgreSQL inbox committed. Alternate lower-amplification direct bulk benchmark can commit raw+dedup+outbox before the same receipt."
