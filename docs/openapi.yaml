            "type": "array",
            "maxItems": 500,
            "items": {
              "$ref": "#/components/schemas/Event"
            },
            "minItems": 1
          }
        },
        "description": "Authenticated child-source GPS observation upload. Stable batch UUID and stable individual event UUIDs survive retries. Strict byte and decompression-ratio caps apply in server middleware. The current decimal RFC3339 event wire schema stays unchanged; compact integer t_ms/lat_e6/lon_e6 is a future explicitly negotiated version, never mixed implicitly."
      },
      "Receipt": {
        "type": "object",
        "required": [
          "batch_id",
          "accepted_count",
          "duplicate_count",
          "rejected_count",
          "processing"
        ],
        "properties": {
          "batch_id": {
            "type": "string",
            "format": "uuid"
          },
          "accepted_count": {
            "type": "integer"
