{
  "openapi": "3.1.0",
  "info": {
    "title": "Madalasa–Alarka M1 Secure Foundation API",
    "version": "1.0.0-m1-draft",
    "description": "M1 only. Synthetic test identities. All ParentOIDC operations require live family + child-specific scope. Device token must match path identity and be bound to Android Keystore key proof. A Google ID token is not legal guardian evidence.\n\nProduct display names: Madalasa (guardian Android app), Alarka (child Android companion). The GitHub repo is Madalasa-Alarka. Naming does not change API paths, auth audiences or package IDs; legal under-18 gates remain required.\n\nDevice credentials are short-lived and renewed with a Keystore key proof (requestCredentialChallenge, renewDeviceCredential); see docs/M1_DEVICE_CREDENTIAL_LIFECYCLE.md. Each operation lists only the errors it can return. Conventions (error catalog, idempotency, pagination, versioning, time and ID formats): docs/API_CONVENTIONS_AND_ERROR_CATALOG.md."
  },
  "servers": [
    {
      "url": "https://api.example.invalid/v1",
      "description": "INVALID placeholder: replace with actual India-region domain after approval"
    }
  ],
  "tags": [
    {
      "name": "Families"
    },
    {
      "name": "Children"
    },
    {
      "name": "Pairing"
    },
    {
      "name": "Devices"
    },
    {
      "name": "Enrollment"
    }
  ],
  "components": {
    "securitySchemes": {
      "ParentOIDC": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "OIDC JWT"
      },
      "DeviceBearer": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "Key-bound access token"
      }
    },
    "schemas": {
      "Uuid": {
        "type": "string",
        "format": "uuid"
      },
      "Error": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "code": {
            "type": "string",
            "enum": [
              "INVALID_REQUEST",
              "UNAUTHENTICATED",
              "FORBIDDEN",
              "NOT_FOUND",
              "CONFLICT",
              "IDEMPOTENCY_KEY_REUSED",
              "CODE_EXPIRED_OR_USED",
              "PAYLOAD_TOO_LARGE",
              "VALIDATION_FAILED",
              "RATE_LIMITED",
              "INTERNAL_ERROR",
              "SERVICE_UNAVAILABLE"
            ],
            "description": "Stable machine-readable code. Clients branch on this, never on message. Catalog and HTTP status mapping: docs/API_CONVENTIONS_AND_ERROR_CATALOG.md"
          },
          "message": {
            "type": "string",
            "maxLength": 300,
            "description": "Short English text for logs and developers. Never contains secrets or other tenants' identifiers. Not localized and not for programmatic use."
          },
          "request_id": {
            "type": "string",
            "format": "uuid",
            "description": "Same value as the X-Request-Id response header. Quote it to support."
          },
          "retryable": {
            "type": "boolean"
          }
        },
        "required": [
          "code",
          "message",
          "request_id",
          "retryable"
        ]
      },
      "Family": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "label": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "status": {
            "type": "string",
            "enum": [
              "ACTIVE",
              "SUSPENDED"
            ]
          }
        },
        "required": [
          "id",
          "label",
          "status"
        ]
      },
      "Child": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "family_id": {
            "type": "string",
            "format": "uuid"
          },
          "alias": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          },
          "state": {
            "type": "string",
            "enum": [
              "ACTIVE",
              "SUSPENDED"
            ]
          }
        },
        "required": [
          "id",
          "family_id",
          "alias",
          "state"
        ]
      },
      "Device": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "child_id": {
            "type": "string",
            "format": "uuid"
          },
          "device_mode": {
            "type": "string",
            "enum": [
              "STANDARD",
              "MANAGED_DEVICE_OWNER",
              "UNKNOWN"
            ]
          },
          "enrollment_state": {
            "type": "string",
            "enum": [
              "PENDING_PROOF",
              "ACTIVE",
              "REVOKED"
            ]
          },
          "last_reported_at": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          }
        },
        "required": [
          "id",
          "child_id",
          "device_mode",
          "enrollment_state",
          "last_reported_at"
        ]
      },
      "PairingCode": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "pairing_code": {
            "type": "string",
            "minLength": 8,
            "maxLength": 64
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          },
          "child_id": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "pairing_code",
          "expires_at",
          "child_id"
        ]
      },
      "Redeem": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "pairing_code": {
            "type": "string",
            "minLength": 8,
            "maxLength": 64
          },
          "public_key_spki_base64": {
            "type": "string",
            "minLength": 80,
            "maxLength": 4096
          },
          "algorithm": {
            "type": "string",
            "enum": [
              "ECDSA_P256_SHA256"
            ]
          },
          "app_version": {
            "type": "string",
            "maxLength": 60
          },
          "android_api": {
            "type": "integer",
            "minimum": 29,
            "maximum": 45
          }
        },
        "required": [
          "pairing_code",
          "public_key_spki_base64",
          "algorithm",
          "app_version",
          "android_api"
        ]
      },
      "Challenge": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "enrollment_id": {
            "type": "string",
            "format": "uuid"
          },
          "device_id": {
            "type": "string",
            "format": "uuid"
          },
          "nonce_base64url": {
            "type": "string",
            "minLength": 24,
            "maxLength": 200
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          },
          "challenge_context": {
            "type": "string",
            "enum": [
              "amar-pola-m1-device-enroll-v1"
            ]
          }
        },
        "required": [
          "enrollment_id",
          "device_id",
          "nonce_base64url",
          "expires_at",
          "challenge_context"
        ]
      },
      "Proof": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "nonce_base64url": {
            "type": "string",
            "minLength": 24,
            "maxLength": 200
          },
          "signature_base64url": {
            "type": "string",
            "minLength": 48,
            "maxLength": 4096
          }
        },
        "required": [
          "nonce_base64url",
          "signature_base64url"
        ]
      },
      "DeviceToken": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "device_id": {
            "type": "string",
            "format": "uuid"
          },
          "credential_token": {
            "type": "string",
            "minLength": 32
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "device_id",
          "credential_token",
          "expires_at"
        ],
        "description": "Short-lived opaque bearer credential. There is no per-request signing: the device proves key possession only at enrollment and when renewing (see /devices/{deviceId}/credential/*). Renew before expires_at."
      },
      "FeatureState": {
        "type": "string",
        "enum": [
          "SUPPORTED",
          "UNSUPPORTED",
          "PERMISSION_REQUIRED",
          "OS_REJECTED",
          "UNKNOWN"
        ]
      },
      "Capabilities": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "observed_at": {
            "type": "string",
            "format": "date-time"
          },
          "android_api": {
            "type": "integer",
            "minimum": 29,
            "maximum": 45
          },
          "manufacturer": {
            "type": "string",
            "maxLength": 60
          },
          "model": {
            "type": "string",
            "maxLength": 100
          },
          "app_version": {
            "type": "string",
            "maxLength": 60
          },
          "device_mode": {
            "type": "string",
            "enum": [
              "STANDARD",
              "MANAGED_DEVICE_OWNER",
              "UNKNOWN"
            ]
          },
          "is_device_owner": {
            "type": "boolean"
          },
          "location": {
            "$ref": "#/components/schemas/FeatureState"
          },
          "usage_access": {
            "$ref": "#/components/schemas/FeatureState"
          },
          "notifications": {
            "$ref": "#/components/schemas/FeatureState"
          },
          "managed_package_suspend": {
            "$ref": "#/components/schemas/FeatureState"
          }
        },
        "required": [
          "observed_at",
          "android_api",
          "device_mode",
          "is_device_owner",
          "location",
          "usage_access",
          "notifications",
          "managed_package_suspend"
        ]
      },
      "Health": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "observed_at": {
            "type": "string",
            "format": "date-time"
          },
          "battery_percent": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 0,
            "maximum": 100
          },
          "charging": {
            "type": "boolean"
          },
          "permission_revision": {
            "type": "integer",
            "minimum": 0
          },
          "app_version": {
            "type": "string",
            "maxLength": 60
          }
        },
        "required": [
          "observed_at",
          "battery_percent",
          "charging",
          "permission_revision"
        ]
      },
      "Receipt": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "state": {
            "type": "string",
            "enum": [
              "ACCEPTED",
              "ALREADY_RECORDED"
            ]
          },
          "recorded_at": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "id",
          "state",
          "recorded_at"
        ]
      },
      "ListChildren": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Child"
            }
          }
        },
        "required": [
          "items"
        ]
      },
      "ListDevices": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Device"
            }
          }
        },
        "required": [
          "items"
        ]
      },
      "FamilyMembership": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "label": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "status": {
            "type": "string",
            "enum": [
              "ACTIVE",
              "SUSPENDED"
            ]
          },
          "membership_role": {
            "type": "string",
            "enum": [
              "OWNER",
              "GUARDIAN"
            ]
          }
        },
        "required": [
          "id",
          "label",
          "status",
          "membership_role"
        ]
      },
      "ListFamilies": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/FamilyMembership"
            }
          }
        },
        "required": [
          "items"
        ]
      },
      "CredentialChallengeRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "key_fingerprint_sha256_base64url": {
            "type": "string",
            "minLength": 43,
            "maxLength": 43,
            "description": "SHA-256 of the device's enrolled SPKI key, base64url without padding. The server compares it with the active key before issuing a challenge."
          }
        },
        "required": [
          "key_fingerprint_sha256_base64url"
        ]
      },
      "CredentialChallenge": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "challenge_id": {
            "type": "string",
            "format": "uuid"
          },
          "device_id": {
            "type": "string",
            "format": "uuid"
          },
          "nonce_base64url": {
            "type": "string",
            "minLength": 24,
            "maxLength": 200
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          },
          "challenge_context": {
            "type": "string",
            "enum": [
              "amar-pola-m1-device-renew-v1"
            ],
            "description": "Signed together with the nonce so an enrollment proof can never be replayed as a renewal proof."
          }
        },
        "required": [
          "challenge_id",
          "device_id",
          "nonce_base64url",
          "expires_at",
          "challenge_context"
        ]
      },
      "CredentialRenewal": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "challenge_id": {
            "type": "string",
            "format": "uuid"
          },
          "nonce_base64url": {
            "type": "string",
            "minLength": 24,
            "maxLength": 200
          },
          "signature_base64url": {
            "type": "string",
            "minLength": 48,
            "maxLength": 4096
          }
        },
        "required": [
          "challenge_id",
          "nonce_base64url",
          "signature_base64url"
        ]
      }
    },
    "headers": {
      "RequestId": {
        "description": "Server-generated UUID for this response; identical to Error.request_id on failures.",
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "RetryAfter": {
        "description": "Seconds the client must wait before retrying.",
        "schema": {
          "type": "integer",
          "minimum": 0,
          "maximum": 86400
        }
      }
    },
    "parameters": {
      "IdempotencyKey": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "description": "Client-generated UUID, new for each logical create and reused unchanged on retries. Replays within 24 hours return the original result.",
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      }
    }
  },
  "paths": {
    "/families": {
      "post": {
        "operationId": "createFamily",
        "tags": [
          "Families"
        ],
        "summary": "Create family under authenticated parent",
        "security": [
          {
            "ParentOIDC": []
          }
        ],
        "x-required-scope": "CREATE_FAMILY",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "responses": {
          "201": {
            "description": "Successful",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Family"
                }
              }
            },
            "headers": {
              "X-Request-Id": {
                "$ref": "#/components/headers/RequestId"
              }
            }
          },
          "400": {
            "description": "Malformed request or invalid identifier",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "headers": {
              "X-Request-Id": {
                "$ref": "#/components/headers/RequestId"
              }
            },
            "x-error-codes": [
              "INVALID_REQUEST"
            ]
          },
          "401": {
            "description": "Missing, expired or invalid credential",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "headers": {
              "X-Request-Id": {
                "$ref": "#/components/headers/RequestId"
              }
            },
            "x-error-codes": [
              "UNAUTHENTICATED"
            ]
          },
          "409": {
            "description": "Family already exists for this request",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "headers": {
              "X-Request-Id": {
                "$ref": "#/components/headers/RequestId"
              }
            },
            "x-error-codes": [
              "CONFLICT",
              "IDEMPOTENCY_KEY_REUSED"
            ]
          },
          "413": {
            "description": "Body too large",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "headers": {
              "X-Request-Id": {
                "$ref": "#/components/headers/RequestId"
              }
            },
            "x-error-codes": [
              "PAYLOAD_TOO_LARGE"
            ]
          },
          "422": {
            "description": "Well-formed but unsupported or out of range",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "headers": {
              "X-Request-Id": {
                "$ref": "#/components/headers/RequestId"
              }
            },
            "x-error-codes": [
              "VALIDATION_FAILED"
            ]
          },
          "429": {
            "description": "Rate limit",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "headers": {
              "X-Request-Id": {
                "$ref": "#/components/headers/RequestId"
              },
              "Retry-After": {
                "$ref": "#/components/headers/RetryAfter"
              }
            },
            "x-error-codes": [
              "RATE_LIMITED"
            ]
          },
          "503": {
            "description": "Service unavailable",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "headers": {
              "X-Request-Id": {
                "$ref": "#/components/headers/RequestId"
              },
              "Retry-After": {
                "$ref": "#/components/headers/RetryAfter"
              }
            },
            "x-error-codes": [
              "SERVICE_UNAVAILABLE"
            ]
          }
        },
        "requestBody": {
          "required": true,
