name: Android UI compilation and unit tests

on:
  push:
    branches: [parent, child]
    paths:
      - "android/**"
      - ".github/workflows/android-ui-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current workstream
        uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK tools
        uses: android-actions/setup-android@v3
      - name: Install required Android platforms
        run: sdkmanager --install "platforms;android-34" "platforms;android-36" "build-tools;34.0.0" "build-tools;36.0.0"
      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile both APKs and run privacy UI JVM tests
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            :madalasa:assembleDebug :alarka:assembleDebug \
            :madalasa:testDebugUnitTest :alarka:testDebugUnitTest
