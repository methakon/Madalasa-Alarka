name: Android UI compilation and unit tests

on:
  push:
    branches: [parent, child, dev, main]
    paths:
      - "android/**"
      - ".github/workflows/android-ui-build.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "android/**"
      - ".github/workflows/android-ui-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current workstream
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Compile both APKs and run privacy UI JVM tests
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            :madalasa:assembleDebug :alarka:assembleDebug \
            :madalasa:assembleRelease :alarka:assembleRelease \
            :madalasa:testDebugUnitTest :alarka:testDebugUnitTest
