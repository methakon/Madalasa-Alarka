name: Documentation structure and draft status

on:
  push:
    paths:
      - "docs/**"
      - "android/**"
      - "public/legal/**"
      - "README.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - ".github/workflows/documentation-structure.yml"
      - "backend/tests/test_pending_identity_documentation.py"
  pull_request:
    # Documentation-inventory verifier changes must trigger this check too.
    paths:
      - "docs/**"
      - "android/**"
      - "public/legal/**"
      - "README.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - ".github/workflows/documentation-structure.yml"
      - "backend/tests/test_pending_identity_documentation.py"

permissions:
  # No credentials or publishing permissions are needed by inventory validation.
  contents: read

jobs:
  docs-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/tools/requirements.txt
      - name: Install pinned offline documentation-parser dependencies
        run: python3 -m pip install -r docs/tools/requirements.txt
      - name: Verify documentation parser and negative controls
        run: python3 -m unittest discover -s docs/tools -p 'test_*.py' -v
      - name: Validate current document register and all local navigation
        run: python3 docs/tools/check_documentation.py
      - name: Confirm project documentation and prevent false signed-off blanks
        run: |
          set -eu
          for f in             docs/phases/M1-secure-platform-foundation/02-development-process/BUILD_AND_RUN.md             docs/phases/M0-foundation-and-approvals/03-legal-and-privacy/DPIA.md             docs/phases/M0-foundation-and-approvals/03-legal-and-privacy/DATA_RETENTION_SCHEDULE.md             docs/phases/M8-operational-readiness/02-operations-and-support/INCIDENT_AND_BREACH_RESPONSE_PROCEDURE.md             docs/phases/M1-secure-platform-foundation/03-security-and-permissions/THREAT_MODEL_STRIDE.md             docs/phases/M0-foundation-and-approvals/03-legal-and-privacy/VERIFIABLE_PARENTAL_CONSENT_AND_GUARDIAN_AUTHORITY.md             docs/phases/M0-foundation-and-approvals/03-legal-and-privacy/VENDOR_DPA_AND_PROCESSOR_REGISTER.md             docs/phases/M9-play-release/03-release-gates/DEPLOYMENT_RELEASE_READINESS_CHECKLIST.md             docs/phases/M0-foundation-and-approvals/01-project-governance/PROJECT_DOCUMENTS_INDEX_2026.md             SECURITY.md LICENSE .env.example             CONTRIBUTING.md CODE_OF_CONDUCT.md CHANGELOG.md             android/README.md public/legal/terms.html             public/legal/privacy.html public/legal/refund-cancellation.html
          do
            test -s "$f"
          done
          grep -q "DRAFT" docs/phases/M0-foundation-and-approvals/03-legal-and-privacy/DPIA.md
          grep -q "DRAFT" docs/phases/M0-foundation-and-approvals/03-legal-and-privacy/DATA_RETENTION_SCHEDULE.md
          grep -qi "not published" public/legal/privacy.html
          python3 -m json.tool docs/openapi-m1.yaml >/dev/null
      - name: Validate phase-organized project documentation
        run: python3 backend/tests/check_document_structure.py
      - name: M1 structural contract smoke
        run: python3 backend/tests/lint_openapi_m1.py docs/openapi-m1.yaml
      - name: Verify feasibility and reviewer evidence inventory (not feature acceptance)
        run: python3 -m unittest backend.tests.test_pending_identity_documentation -v
