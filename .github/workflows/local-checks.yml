name: local-checks

# L01-009 - local lint/format/static-analysis and tooling self-tests.
# This CI runs the self-contained local verifiers; it does not build the
# Android APK or the Drogon backend (those need SDK/Drogon toolchains and run
# in dedicated jobs). Neither this CI passing nor any merge grants Play/DPDP
# release permission.

on:
  push:
    branches: [dev, main, api, parent, child, admin-web]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling-and-scans:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Shell lint (shellcheck)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck tools/*.sh || { echo "::error::shellcheck findings"; exit 1; }

      - name: Testkit fakes self-test
        run: python3 testkit/fake-services/fakes.py --selftest

      - name: Synthetic seed repeatability
        run: bash tools/seed-synthetic.sh --check

      - name: SBOM + pinned-version policy
        run: bash tools/check-sbom.sh

      - name: Secret scan (fail on committed secrets)
        run: bash tools/verify-clean-build.sh

      - name: Local smoke pipeline (honest skips)
        run: bash tools/smoke-local.sh

      - name: X402 deployment scripts syntax and Neon env regressions (synthetic only)
        run: |
          bash -n deploy/x402/api/staging-acceptance.sh
          bash -n deploy/x402/api/validate-env.sh
          bash -n deploy/x402/api/test-validate-env.sh
          bash deploy/x402/api/test-validate-env.sh

  python-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile all Python (fail on syntax errors)
        run: |
          python3 -m compileall -q tools testkit backend/tests deploy/x402/api/public-synthetic-sos-acceptance.py deploy/x402/api/public-security-baseline.py || { echo "::error::python syntax errors"; exit 1; }
          if MA_ACCEPTANCE_SYNTHETIC_ONLY=NO python3 deploy/x402/api/public-synthetic-sos-acceptance.py > /tmp/public-sos-negative.log 2>&1; then
            echo "::error::public SOS test must fail closed without explicit synthetic authorization"
            exit 1
          fi
          if MA_SECURITY_BASELINE_AUTHORIZED=NO python3 deploy/x402/api/public-security-baseline.py >/tmp/security-negative.log 2>&1; then
            echo "::error::public security baseline must fail closed without owner authorization"
            exit 1
          fi
